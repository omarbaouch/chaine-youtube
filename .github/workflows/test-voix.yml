name: Test voix

# Génère des extraits de voix française (Pocket TTS, Kyutai) et les publie dans Releases pour les écouter.
on:
  push:
    branches: [main]
    paths: ['tests/voix/**', 'scripts/traitement_audio.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Pocket TTS (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pocket-tts scipy huggingface_hub --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Générer les extraits
        run: python tests/voix/generer.py
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-voix-${{ github.run_number }}" out/voix/*.wav out/voix/LISEZMOI.txt \
            --title "🎙️ Test voix #${{ github.run_number }}" --notes "Écoute et choisis ta voix préférée." --prerelease
