name: Rendu rapide (parallèle)

# Même rendu que "Rendu vidéo", mais découpé sur 6 machines en parallèle (≈ 5× plus rapide pour une vidéo de 8-12 min).
# 1) prépa : rushes + voix + timeline + rushes allégés → artefact
# 2) 6 tranches d'images rendues en parallèle (vidéo muette)
# 3) assemblage : tranches bout à bout + piste son complète + mastering -14 LUFS → Release
# Se lance au push sur la branche studio-b qui touche episodes/** ([brouillon] dans le message = 540p).
on:
  push:
    branches: [studio-b]
    paths: ['episodes/**']

permissions:
  contents: write

concurrency:
  group: rendu-rapide-${{ github.ref }}
  cancel-in-progress: true

env:
  TRANCHES: 6

jobs:
  prepa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      episode: ${{ steps.quoi.outputs.episode }}
      mode: ${{ steps.quoi.outputs.mode }}
      frames: ${{ steps.timeline.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quel épisode ?
        id: quoi
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          avant="${{ github.event.before }}"
          if [ -z "$avant" ] || [ "$avant" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$avant" 2>/dev/null; then avant="HEAD~1"; fi
          ep="$(git diff --name-only "$avant" "${{ github.sha }}" -- episodes | cut -d/ -f2 | sort -u | while read e; do [ -f "episodes/$e/montage.json" ] && echo "$e"; done | head -1)"
          echo "episode=$ep" >> "$GITHUB_OUTPUT"
          if echo "$MESSAGE" | grep -qi '\[brouillon\]'; then echo "mode=brouillon" >> "$GITHUB_OUTPUT"; else echo "mode=final" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.quoi.outputs.episode != ''
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        if: steps.quoi.outputs.episode != ''
        with: {python-version: '3.11', cache: pip, cache-dependency-path: requirements-voix.txt}
      - name: Outils
        if: steps.quoi.outputs.episode != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-voix.txt
      - name: Cache des voix et du modèle
        if: steps.quoi.outputs.episode != ''
        uses: actions/cache@v4
        with:
          path: |
            .cache/voix
            ~/.cache/huggingface
          key: voix-${{ hashFiles('episodes/**/montage.json', 'assets/voix/**') }}
          restore-keys: voix-
      - name: Rushes, voix, timeline
        id: timeline
        if: steps.quoi.outputs.episode != ''
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          ep="${{ steps.quoi.outputs.episode }}"
          node scripts/musique.mjs
          node scripts/sfx.mjs > /dev/null
          node scripts/medias.mjs "$ep"
          python3 scripts/voix.py "$ep"
          node scripts/construire.mjs "$ep"
          node scripts/alleger.mjs "$ep"
          frames=$(node -e "const p=require('./public/ep/$ep/props.json');const t=p.scenes.filter((s,i)=>i&&s.transition!=='coupe').length;console.log(p.scenes.reduce((a,s)=>a+s.duree,0)-t*p.dureeTransition)")
          echo "frames=$frames" >> "$GITHUB_OUTPUT"
          du -sh public/ep/$ep
      - uses: actions/upload-artifact@v4
        if: steps.quoi.outputs.episode != ''
        with:
          name: prepa
          path: |
            public/ep
            public/sfx
          retention-days: 2

  tranche:
    needs: prepa
    if: needs.prepa.outputs.episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        n: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/download-artifact@v4
        with: {name: prepa, path: public}
      - name: Rendu de la tranche
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci
          npx remotion browser ensure
          ep="${{ needs.prepa.outputs.episode }}"; total=${{ needs.prepa.outputs.frames }}; n=${{ matrix.n }}
          taille=$(( (total + TRANCHES - 1) / TRANCHES )); debut=$(( n * taille )); fin=$(( debut + taille - 1 )); [ $fin -ge $total ] && fin=$(( total - 1 ))
          echo "tranche $n : images $debut-$fin / $total"
          mkdir -p out
          echtl=""; [ "${{ needs.prepa.outputs.mode }}" = "brouillon" ] && echtl="--scale=0.5"
          npx remotion render src/index.ts Episode "out/tranche-$n.mkv" "--props=public/ep/$ep/props.json" --frames=$debut-$fin \
            --codec=h264-mkv --audio-codec=pcm-16 --enforce-audio-track --crf=18 $echtl --concurrency=100%
      - uses: actions/upload-artifact@v4
        with: {name: 'tranche-${{ matrix.n }}', path: 'out/tranche-${{ matrix.n }}.mkv', retention-days: 2}

  assemblage:
    needs: [prepa, tranche]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/download-artifact@v4
        with: {name: prepa, path: public}
      - uses: actions/download-artifact@v4
        with: {pattern: 'tranche-*', path: out, merge-multiple: true}
      - name: Son complet, assemblage, mastering
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci
          ep="${{ needs.prepa.outputs.episode }}"; mode="${{ needs.prepa.outputs.mode }}"
          nom="$ep"; [ "$mode" = "brouillon" ] && nom="$ep-brouillon"
          # son en PCM dans chaque tranche : recollé à l'échantillon près (vérifié identique à un rendu d'un seul tenant)
          for n in 0 1 2 3 4 5; do
            ffmpeg -y -loglevel error -i out/tranche-$n.mkv -map 0:v -c copy out/v-$n.mp4
            ffmpeg -y -loglevel error -i out/tranche-$n.mkv -map 0:a -c:a pcm_s16le -ar 48000 out/a-$n.wav
          done
          for n in 0 1 2 3 4 5; do echo "file 'v-$n.mp4'"; done > out/lv.txt
          for n in 0 1 2 3 4 5; do echo "file 'a-$n.wav'"; done > out/la.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/lv.txt -c copy out/video.mp4
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/la.txt -c copy out/son.wav
          ffmpeg -y -loglevel error -i out/video.mp4 -i out/son.wav -map 0:v -map 1:a -c:v copy \
            -af "loudnorm=I=-14:TP=-1.5:LRA=9" -c:a aac -b:a 192k -ar 48000 -shortest "out/$nom.mp4"
          node scripts/planche.mjs "$ep" "out/$nom.mp4"
          [ -f "public/ep/$ep/credits.txt" ] && cp "public/ep/$ep/credits.txt" "out/$ep-credits.txt"
          ls -la out
      - name: Publier (onglet Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ep="${{ needs.prepa.outputs.episode }}"; mode="${{ needs.prepa.outputs.mode }}"
          tag="$ep-$mode-rapide-${{ github.run_number }}"
          fichiers=$(ls out/$ep*.mp4 out/$ep*-planche.jpg out/$ep-credits.txt 2>/dev/null)
          gh release create "$tag" $fichiers --target "${{ github.sha }}" --title "🎬 $ep ($mode) #${{ github.run_number }}" \
            --notes "Rendu parallèle de episodes/$ep — commit ${{ github.sha }}" --prerelease
